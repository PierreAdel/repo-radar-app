name: Release Please

# Runs on every push to main (the staging -> main promotion point this repo
# already uses). Opens or updates a "Release PR" that accumulates the next
# version bump + CHANGELOG.md from conventional commits since the last
# release - nothing is tagged or released until that PR is reviewed and
# merged. Deployment itself stays separate (Vercel's own GitHub integration),
# same split ci.yml already documents.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The default GITHUB_TOKEN can open the Release PR, but GitHub
          # doesn't let PRs opened with it trigger other workflows'
          # pull_request runs (anti-recursion protection) - so CI won't
          # auto-run on the Release PR without a real token. Add a
          # RELEASE_PLEASE_TOKEN repo secret (a PAT with repo scope) to get
          # that; falls back to GITHUB_TOKEN if it's not set.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
