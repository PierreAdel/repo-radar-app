name: CI

# Deployment is handled separately by Vercel's own GitHub integration (production deploy on
# push to main, preview deploy per PR) — this workflow is CI only: it gates merges on the repo
# actually being lint-clean, type-clean, tested, and buildable.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the exact version from the "packageManager" field in package.json, so this
      # workflow can't silently drift from what's pinned for local development.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # jsdom 30 (used by the vitest suites) ships an undici that calls a webidl API missing
      # from Node 20's runtime — "webidl.util.markAsUncloneable is not a function" — so this
      # needs a newer Node than the package's "engines": ">=20" floor. 22 is the current LTS.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --no-frozen-lockfile: pnpm auto-enables frozen-lockfile whenever it detects a CI
      # environment, regardless of which install flags are passed, so this has to be explicit.
      # This repo's history was assembled as a sequence of incremental PRs, and the lockfile is
      # committed as a whole rather than re-resolved per PR, so a strict frozen check would
      # reject perfectly valid intermediate commits. A plain install still fails on genuinely
      # broken dependency state, just without that extra rigidity.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

  e2e:
    name: E2E + accessibility (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm e2e

  lighthouse:
    name: Performance budget (Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium

      - name: Wait for Vercel preview deployment
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          GIT_SHA: ${{ github.sha }}
        run: |
          URL=$(node scripts/wait-for-vercel-preview.mjs)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check Lighthouse budget
        run: node scripts/check-lighthouse-budget.mjs "${{ steps.preview.outputs.url }}"

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          if-no-files-found: ignore
